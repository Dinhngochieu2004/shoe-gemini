services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ./server/.env
    volumes:
      - ./server/src:/app/src              # hot-reload: nodemon watch source từ host
      - uploads-data:/app/src/uploads      # persist uploads, mount sau để override src/uploads
      - /app/node_modules                  # giữ node_modules trong container, không bị host override
    networks:
      - mern-network
    # ports:
    #   - "5001:5001"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: dev
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - BROWSER=none
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/.env:/app/.env:ro
      - /app/node_modules
    restart: unless-stopped
    networks:
      - mern-network
    # expose:
    #   - "3000"

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - mern-network

  # Chỉ dùng khi cần lấy cert lần đầu: docker compose --profile certbot run --rm certbot
  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    profiles:
      - certbot
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge

volumes:
  uploads-data:
  certbot-certs:
  certbot-www:
