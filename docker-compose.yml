# Production compose — serves pre-built static assets (fast).
# Dev: docker compose -f docker-compose.dev.yml up
# Swarm: docker stack deploy -c docker-stack.yml shoe-app

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      - SERVER_URL=http://localhost
      - REACT_APP_URL=http://localhost
      - REACT_APP_URL_DOMAIN=http://localhost
    volumes:
      - uploads-data:/app/dist/uploads
    networks:
      - mern-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
      args:
        REACT_APP_SERVER: http://localhost
        REACT_APP_IMG: http://localhost/uploads
    restart: unless-stopped
    networks:
      - mern-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mern-network

  # Chỉ dùng khi cần lấy cert lần đầu: docker compose --profile certbot run --rm certbot
  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    profiles:
      - certbot
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge

volumes:
  uploads-data:
  certbot-certs:
  certbot-www:
