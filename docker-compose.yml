services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ./server/.env
    volumes:
      - ./server/src:/app/src              # hot-reload: nodemon watch source từ host
      - uploads-data:/app/src/uploads      # persist uploads, mount sau để override src/uploads
      - /app/node_modules                  # giữ node_modules trong container, không bị host override
    networks:
      - mern-network
    expose:
      - "5001"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - mern-network

  nginx:
    image: nginx:1.27.0-alpine3.19
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge

volumes:
  uploads-data:
