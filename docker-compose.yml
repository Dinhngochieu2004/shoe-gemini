services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      - SERVER_URL=http://localhost
      - REACT_APP_URL=http://localhost
      - REACT_APP_URL_DOMAIN=http://localhost
    volumes:
      - uploads-data:/app/src/uploads      # persist uploads
      - /app/node_modules                  # giữ node_modules trong container, không bị host override
    networks:
      - mern-network
    # ports:
    #   - "5001:5001"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: dev
    environment:
      - REACT_APP_SERVER=http://localhost
      - REACT_APP_IMG=http://localhost/uploads
      - BROWSER=none
      - NODE_OPTIONS=--no-deprecation
    volumes:
      - /app/node_modules
    restart: unless-stopped
    networks:
      - mern-network
    # expose:
    #   - "3000"

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - mern-network

  # Chỉ dùng khi cần lấy cert lần đầu: docker compose --profile certbot run --rm certbot
  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    profiles:
      - certbot
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge

volumes:
  uploads-data:
  certbot-certs:
  certbot-www:
