# Docker Swarm stack — zero-downtime rolling updates.
#
# Zero-downtime cơ chế:
#   • order: start-first   → container mới healthy TRƯỚC KHI container cũ dừng
#   • healthcheck          → swarm biết container đã sẵn sàng nhận traffic
#   • failure_action: rollback → tự rollback nếu update thất bại
#   • monitor              → quan sát sau update trước khi xác nhận thành công
#
# Deploy lần đầu:
#   docker swarm init
#   docker stack deploy -c docker-stack.yml shoe-app
#
# Rolling update (chỉ cần re-deploy — không có downtime):
#   docker stack deploy -c docker-stack.yml shoe-app
#
# Tạo secrets (chạy 1 lần):
#   echo "mongodb+srv://..." | docker secret create mongo_uri -
#   echo "redis://..."       | docker secret create redis_uri -
#   ... (xem danh sách secrets ở cuối file)

services:

  # ─── Backend ──────────────────────────────────────────────────────────────
  backend:
    image: dinhngochieu3112004/shoe-gemini-backend:latest
    environment:
      - PORT=5001
      - SERVER_URL=https://giaythethao.click
      - REACT_APP_URL=https://giaythethao.click
      - REACT_APP_URL_DOMAIN=https://giaythethao.click
    secrets:
      - mongo_uri
      - redis_uri
      - jwt_access_key
      - jwt_refresh_key
      - momo_access_key
      - momo_secret_key
      - vnpay_tmn_code
      - vnpay_secure_secret
      - gemini_api_key
      - email_user
      - email_client_id
      - email_client_secret
      - email_redirect_uri
      - email_refresh_token
    volumes:
      - uploads-data:/app/dist/uploads
    networks:
      - mern-stack-net
    # Healthcheck: swarm dùng để quyết định container đã sẵn sàng nhận traffic
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
          - node.labels.uploads == true
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first          # key: mới healthy → cũ dừng (0 downtime)
        failure_action: rollback
        monitor: 30s                # quan sát 30s sau khi container mới lên
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        failure_action: pause
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    image: dinhngochieu3112004/shoe-gemini-frontend:latest
    networks:
      - mern-stack-net
    # Healthcheck: nginx trong container production trả về 200 cho "/"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1    # mỗi node chạy tối đa 1 frontend replica
      update_config:
        parallelism: 1              # update từng replica một
        delay: 10s
        order: start-first          # 0 downtime
        failure_action: rollback
        monitor: 20s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
        failure_action: pause
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s

  # ─── Nginx (gateway + TLS) ────────────────────────────────────────────────
  nginx:
    image: nginx:1.27.0-alpine3.19
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host                  # host mode: bypass routing-mesh, giảm latency
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    configs:
      - source: nginx_main_conf
        target: /etc/nginx/nginx.conf
      - source: nginx_ssl_conf
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - mern-stack-net
    deploy:
      # replicas: 1 trên manager — cho phép order: start-first (global mode không hỗ trợ)
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s

  # ─── Certbot auto-renew ───────────────────────────────────────────────────
  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Renew mỗi 12h — cert 90 ngày, tự renew từ ngày ~60
    command:
      - sh
      - -c
      - "trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot --quiet; sleep 43200; done"
    networks:
      - mern-stack-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s

# ─── Configs ────────────────────────────────────────────────────────────────
configs:
  nginx_main_conf:
    file: ./nginx/nginx.conf
  nginx_ssl_conf:
    file: ./nginx/nginx-ssl.conf

# ─── Secrets (tạo trước khi deploy) ─────────────────────────────────────────
# echo "<value>" | docker secret create <name> -
secrets:
  mongo_uri:
    external: true
  redis_uri:
    external: true
  jwt_access_key:
    external: true
  jwt_refresh_key:
    external: true
  momo_access_key:
    external: true
  momo_secret_key:
    external: true
  vnpay_tmn_code:
    external: true
  vnpay_secure_secret:
    external: true
  gemini_api_key:
    external: true
  email_user:
    external: true
  email_client_id:
    external: true
  email_client_secret:
    external: true
  email_redirect_uri:
    external: true
  email_refresh_token:
    external: true

# ─── Networks ────────────────────────────────────────────────────────────────
networks:
  mern-stack-net:
    driver: overlay
    driver_opts:
      encrypted: "true"           # mã hóa traffic giữa các node

# ─── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  uploads-data:
    driver: local                 # single-node: OK. Multi-node: dùng NFS driver.
  certbot-certs:
    driver: local
  certbot-www:
    driver: local
